<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India in CWG 2026 - Navbar</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0f172a;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 19px 32px;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #f8fafc;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #06b6d4;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            color: #06b6d4;
        }

        /* Tablet Layout (768px - 1024px) */
        @media (max-width: 1024px) {
            .navbar {
                padding: 16px 24px;
            }

            .logo {
                font-size: 20px;
            }

            .nav-links {
                gap: 24px;
            }

            .nav-links a {
                font-size: 14px;
            }
        }

        /* Phone Layout (Up to 768px) */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 16px;
                padding: 16px 16px;
            }

            .logo {
                font-size: 18px;
            }

            .nav-links {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .nav-links a {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="#" class="logo">INDIA <span>CWG 2026</span></a>
            <ul class="nav-links">
                <li><a href="#overview">Overview</a></li>
                <li><a href="#achievements">Achievements</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

</body>
</html>
